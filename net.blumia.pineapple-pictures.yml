id: net.blumia.pineapple-pictures
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: ppic

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --device=dri

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  

modules:
  - name: inih
    buildsystem: meson
    config-opts:
      - -Ddefault_library=shared
      - -Ddistro_install=true
      - -Dwith_INIReader=true
    sources:
      - type: archive
        url: https://github.com/benhoyt/inih/archive/refs/tags/r63.tar.gz
        sha256: 5d7967de62c5bfdc4f9f5ab06ce44c9e498bae021c7dac5792c0696e76aa9963
        x-checker-data:
          type: anitya
          project-id: 11600
          stable-only: true
          url-template: "https://github.com/benhoyt/inih/archive/refs/tags/r$version.tar.gz"
  - name: exiv2
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DEXIV2_ENABLE_XMP=ON
      - -DEXIV2_ENABLE_EXTERNAL_XMP=OFF
      - -DEXIV2_ENABLE_PNG=ON
      - -DEXIV2_ENABLE_NLS=ON
      - -DEXIV2_ENABLE_PRINTUCS2=ON
      - -DEXIV2_ENABLE_LENSDATA=ON
      - -DEXIV2_ENABLE_VIDEO=OFF
      - -DEXIV2_ENABLE_WEBREADY=OFF
      - -DEXIV2_ENABLE_DYNAMIC_RUNTIME=OFF
      - -DEXIV2_ENABLE_CURL=OFF
      - -DEXIV2_ENABLE_SSH=OFF
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_PO=OFF
      - -DEXIV2_BUILD_EXIV2_COMMAND=OFF
      - -DEXIV2_BUILD_UNIT_TESTS=OFF
      - -DEXIV2_BUILD_DOC=OFF
      - -DEXIV2_TEAM_EXTRA_WARNINGS=OFF
      - -DEXIV2_TEAM_WARNINGS_AS_ERRORS=OFF
      - -DEXIV2_TEAM_USE_SANITIZERS=OFF
      - -DEXIV2_ENABLE_WIN_UNICODE=OFF
    sources:
      - type: archive
        url: https://github.com/Exiv2/exiv2/archive/refs/tags/v0.28.9.tar.gz
        sha256: 700b76b97695b2fab4ef8c79619c68ae57d09e0c130724791cafbd39e0eb4aef
        x-checker-data:
          type: anitya
          project-id: 769
          stable-only: true
          url-template: "https://github.com/Exiv2/exiv2/archive/refs/tags/v$version.tar.gz"
  - name: pineapple-pictures
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/BLumia/pineapple-pictures.git
        tag: '1.6.1'
        commit: 987bc76c537bb74961c6900d80de46069861ac9f
        x-checker-data:
          type: anitya
          project-id: 383633
          stable-only: true
          tag-template: $version
